<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <rect width="508" height="508" x="2" y="2" rx="126" fill="none" stroke="#334155" stroke-width="4" opacity="0.6" />

  <!-- Vault Ring / Outer Circle -->
  <circle cx="256" cy="256" r="160" fill="url(#cardGrad)" stroke="#334155" stroke-width="6" />
  
  <!-- Glowing Emerald Accent Ring -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="url(#emeraldGrad)" stroke-width="12" stroke-dasharray="140 30 90 20" filter="url(#glow)" />

  <!-- Stylized Vault V Emblem / Wallet -->
  <path d="M190 200 L256 320 L322 200" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Center Coin / Emerald Node -->
  <circle cx="256" cy="220" r="24" fill="url(#emeraldGrad)" />
</svg>
